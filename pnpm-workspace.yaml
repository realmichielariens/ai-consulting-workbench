packages:
  - "packages/*"
  - "apps/*"
  - "e2e"
  - "demo"

# pnpm >=10 blocks install (lifecycle) scripts for dependencies by default.
# Empirically (pnpm 11.5.1, checked via `pnpm install` output), the
# mechanism it honours is `allowBuilds` here, not the older
# `pnpm.onlyBuiltDependencies` package.json field. `pnpm install` itself
# discovers which packages have blocked scripts and stubs them in here with
# a placeholder; the values below are the explicit decisions:
#   better-sqlite3                     needs its postinstall to select the
#                                       prebuilt native addon (verified: see
#                                       iterations/I1/reports/P0b-scaffold.md)
#   esbuild                            needs its postinstall to install the
#                                       platform binary (pulled in by tsx,
#                                       vite, drizzle-kit)
#   @anthropic-ai/claude-agent-sdk     install step for the bundled Claude
#                                       Code CLI
#   playwright / @playwright/test      postinstall registration; the browser
#                                       binary itself is still fetched
#                                       explicitly via `playwright install
#                                       chromium`
#   msw                                its postinstall only offers to write a
#                                       browser mock service worker file
#                                       (`msw init`), which I1 does not use
#                                       (component tests run under jsdom, not
#                                       a real browser) — left disabled
allowBuilds:
  better-sqlite3: true
  esbuild: true
  msw: false
  "@anthropic-ai/claude-agent-sdk": true
  playwright: true
  "@playwright/test": true

minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk@0.3.280'
