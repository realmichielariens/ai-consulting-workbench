# Hosted showcase on Fly.io (docs/DEPLOY-FLY.md). The app name is a random
# string so the hostname is not guessable; the password gate is the real lock.
app = "wb-bee492c6678ad9216368"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

# Engagements, the SQLite DBs, the agent config dir and user sources all live here.
[mounts]
  source = "workbench_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # State is on the machine's volume and runs are child processes: keep exactly one machine up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

# Each agent run is a Claude Code child process; up to 3 run at once (maxConcurrentRuns).
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
