      - publish:
          slot: stakeholders
          sourcePath: stakeholders.md
          kind: minor
          note: Corrected per the human's note.
      - text: Updated the stakeholders list, thanks for the correction.
  - match: benchmark
    steps:
      - propose:
          rationale: A short benchmarking scan would ground the roadmap's recommendations against how comparable manufacturers have approached similar ERP/MES modernization, without holding up Synthesis.
          ops:
            - op: add_item
              def:
                id: WI-005
                title: Short benchmarking scan
                parent: PH-2
                order: 2
                executor: agent
                inputs:
                  - slot: ENG/context
                    required: true
                outputs:
                  - slot: benchmark
                    format: md
                    scope: project
                    description: A short scan of how comparable manufacturers approached similar IT modernization
                    required: true
                gate: []
                autostart: true
                acceptance:
                  - Cites at least two comparable organizations or credible sources
                brief: |
                  A short scan (not a full study) of how comparable mid-size manufacturers have approached ERP/MES modernization, fourth-product-line expansion or similar IT strategy decisions, to ground the roadmap's recommendations against outside precedent.
      - text: Proposed a short benchmarking scan under Synthesis.
  - match: where are we|status
    steps:
      - status: true
fallback:
  - text: Got it, noted. Let me know if there's anything else before we lock in the plan.
